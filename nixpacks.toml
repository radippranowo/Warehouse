# Railway / Nixpacks build configuration untuk Laravel + Inertia + Vue
# Docs: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "php83Extensions.bcmath",
  "php83Extensions.intl",
  "php83Extensions.exif",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mysqli",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.openssl",
  "php83Extensions.tokenizer",
  "php83Extensions.fileinfo",
  "php83Extensions.ctype",
  "php83Extensions.session",
  "php83Extensions.simplexml",
  "php83Extensions.dom",
  "php83Extensions.iconv",
  "php83Packages.composer",
  "nodejs_22"
]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --no-progress",
  "rm -f package-lock.json",
  "npm install --legacy-peer-deps --include=optional --no-audit --no-fund"
]

# Build hanya compile asset frontend. JANGAN cache config/route di sini —
# env Railway (DB, APP_URL) baru tersedia saat runtime, bukan build.
[phases.build]
dependsOn = ["install"]
cmds = [
  "npm run build"
]

# Caching config/route/view dilakukan saat runtime (env sudah lengkap),
# lalu migrate, lalu jalankan server di port yang Railway berikan.
[start]
cmd = "php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
